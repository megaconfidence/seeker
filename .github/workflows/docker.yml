# Tests Seeker, then builds its image for linux/amd64 and linux/arm64 and publishes it as
# ghcr.io/<owner>/seeker. Pull requests are tested and built, but nothing is published.
# Changes that only touch documentation don't run it, so they don't publish an image that
# Watchtower would then deploy. GitHub ignores path filters for tag pushes, so tags always build.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_DESCRIPTION: Self-hosted music downloader for Soulseek. Finds music through slskd, checks it, tags it and files it in your library.

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows the description of a multi-arch image from its index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # GHCR needs a lowercase name; metadata-action lowercases the owner.
          images: ghcr.io/${{ github.repository_owner }}/seeker
          # latest follows the default branch only, not version tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Seeker
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=Seeker
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: seeker
          platforms: linux/amd64,linux/arm64
          build-args: SEEKER_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
