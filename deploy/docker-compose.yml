# slskd + Seeker for a home server, using the published Seeker image (nothing to build)
#
#   Seeker -> http://<server>:7335   (search and download, library, player)
#   slskd  -> http://<server>:5030   (Soulseek connection, shares, raw transfers)
#
# Run docker compose from this folder, with a .env next to this file (copy ../.env.example).
# Relative paths, here and in .env, are relative to this folder.
# For HTTPS, add docker-compose.https.yml (see "Run it on a home server" in the README).

name: seeker

services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_WEB_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/downloads
      - SLSKD_SHARED_DIR=/music
      - SLSKD_SLSK_LISTEN_PORT=50300
    ports:
      - "5030:5030"     # web UI / API (keep it on your LAN, don't forward it)
      - "50300:50300"   # Soulseek peer connections (forward this on your router)
    volumes:
      - ./slskd:/app
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MUSIC_DIR:-./music}:/music:ro
    restart: unless-stopped

  seeker:
    # Published by .github/workflows/docker.yml on every push to main. If you run your own fork,
    # set SEEKER_IMAGE in .env to ghcr.io/<your-github-user>/seeker:latest.
    image: ${SEEKER_IMAGE:-ghcr.io/megaconfidence/seeker:latest}
    container_name: seeker
    labels:
      # Lets Watchtower update Seeker when a new image is published, even when Watchtower only
      # updates containers that opt in (--label-enable).
      - com.centurylinklabs.watchtower.enable=true
    user: "${PUID:-1000}:${PGID:-1000}"
    # Start order only: slskd's healthcheck runs once a minute, and Seeker connects to slskd
    # on its own as soon as it's up.
    depends_on:
      - slskd
    environment:
      - TZ=${TZ:-UTC}
      - SEEKER_PASSWORD=${SEEKER_PASSWORD}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
    ports:
      - "7335:7335"
    volumes:
      - ./seeker-data:/data
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MUSIC_DIR:-./music}:/music
      - ${IMPORT_DIR:-./import}:/import
    restart: unless-stopped
