# slskd (Soulseek client) + Seeker (search, download, tag and file music)
#
#   Seeker  -> http://localhost:7335   (search and download, library, player)
#   slskd -> http://localhost:5030   (Soulseek connection, shares, raw transfers)
#
# Folders (paths can be changed in .env):
#   MUSIC_DIR      your finished, tagged library (also shared back on Soulseek, read-only)
#   DOWNLOADS_DIR  slskd's download folder, which Seeker picks finished downloads up from
#   IMPORT_DIR     music you already have, for Seeker to tag and add to the library

services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_WEB_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/downloads
      - SLSKD_SHARED_DIR=/music
      - SLSKD_SLSK_LISTEN_PORT=50300
    ports:
      - "5030:5030"     # web UI / API
      - "50300:50300"   # Soulseek peer connections (forward this on your router for best results)
    volumes:
      - ./slskd:/app
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MUSIC_DIR:-./music}:/music:ro
    restart: unless-stopped

  seeker:
    build: ./seeker
    image: seeker:latest
    container_name: seeker
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      - slskd
    environment:
      - TZ=${TZ:-UTC}
      - SEEKER_PASSWORD=${SEEKER_PASSWORD}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
    ports:
      - "7335:7335"
    volumes:
      - ./seeker-data:/data
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MUSIC_DIR:-./music}:/music
      - ${IMPORT_DIR:-./import}:/import
    restart: unless-stopped
